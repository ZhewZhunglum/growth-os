{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · PUKO Growth OS</title><link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="brand auth-brand"><span class="brand-mark">P</span><span><strong>PUKO</strong><small>Growth OS</small></span></div>
        <p class="eyebrow">公司内部工作台</p><h1>登录后继续</h1>
        <p class="muted">任务、审核和发布记录都保存在同一条可追溯流程中。</p>
        {% if form.errors %}<p class="form-error">用户名或密码不正确，请重新输入。</p>{% endif %}
        <form method="post" class="auth-form" id="growth-os-login-form">
            {% csrf_token %}
            <label for="id_username">用户名</label>
            {{ form.username.errors }}
            <input type="text" name="username" value="{{ form.username.value|default_if_none:'' }}" maxlength="150" autocapitalize="none" autocomplete="username" autofocus required id="id_username">
            <label for="id_password">密码</label>
            {{ form.password.errors }}
            <input type="password" name="password" autocomplete="current-password" required id="id_password">
            <label class="remember-username" for="id_remember_username">
                <input type="checkbox" id="id_remember_username" checked>
                <span>在这台电脑上记住用户名</span>
            </label>
            <p class="privacy-note">系统只保存用户名；密码是否保存由浏览器的密码管理器决定。</p>
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <button class="button button-primary" type="submit">登录</button>
        </form>
    </main>
    <script>
    (() => {
        const form = document.getElementById("growth-os-login-form");
        const username = document.getElementById("id_username");
        const remember = document.getElementById("id_remember_username");
        const usernameKey = "growth_os.remembered_username.v1";
        const preferenceKey = "growth_os.remember_username_preference.v1";
        try {
            const preference = window.localStorage.getItem(preferenceKey);
            remember.checked = preference !== "off";
            if (remember.checked && !username.value) {
                username.value = window.localStorage.getItem(usernameKey) || "";
            }
        } catch (_error) {
            remember.checked = false;
        }
        form.addEventListener("submit", () => {
            try {
                if (remember.checked) {
                    window.localStorage.setItem(usernameKey, username.value.trim());
                    window.localStorage.setItem(preferenceKey, "on");
                } else {
                    window.localStorage.removeItem(usernameKey);
                    window.localStorage.setItem(preferenceKey, "off");
                }
            } catch (_error) {
                // 登录不依赖浏览器存储；存储不可用时直接继续提交。
            }
        });
    })();
    </script>
</body>
</html>
