name: Release image

# Manual only. This workflow builds one immutable application image from an
# exact release SHA and publishes it to GHCR. It never deploys to a server and
# never touches a database. Deployment stays with scripts/deploy-staging.sh,
# which pins the image by the digest reported here.

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact 40-character lowercase Git SHA to build"
        required: true
        type: string
      run_tests:
        description: "Run the verification gate before building"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ${{ github.repository_owner }}/growth-os
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # The deployment scripts reject branch names, abbreviated SHAs and mutable
  # tags. Fail here rather than producing an image that cannot be deployed.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate release SHA
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.check.outputs.release_sha }}
    steps:
      - name: Check SHA shape
        id: check
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -eu
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::release_sha must be exactly 40 lowercase hexadecimal characters."
            exit 1
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.check.outputs.release_sha }}
          persist-credentials: false

      - name: Confirm HEAD is the requested commit
        env:
          RELEASE_SHA: ${{ steps.check.outputs.release_sha }}
        run: |
          set -eu
          actual=$(git rev-parse HEAD)
          [ "$actual" = "$RELEASE_SHA" ] || {
            echo "::error::Checked out $actual, expected $RELEASE_SHA."
            exit 1
          }
          echo "Release SHA confirmed: $RELEASE_SHA"

  # ---------------------------------------------------------------------------
  # SQLite covers the bulk of the suite. PostgreSQL additionally executes the
  # concurrency acceptance tests, which skip themselves on any other backend.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (${{ matrix.backend }})
    needs: validate
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgresql]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: growth_os_ci
          POSTGRES_USER: growth_os_ci
          POSTGRES_PASSWORD: growth-os-ci-not-a-real-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growth_os_ci -d growth_os_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      GROWTH_OS_ENV: local
      DATABASE_ENGINE: ${{ matrix.backend }}
      POSTGRES_DB: growth_os_ci
      POSTGRES_USER: growth_os_ci
      POSTGRES_PASSWORD: growth-os-ci-not-a-real-secret
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Test suite
        run: python manage.py test --verbosity=2

  # ---------------------------------------------------------------------------
  # Build and publish. No deploy step exists in this workflow by design.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and push image
    needs: [validate, verify]
    # Still run when the verification gate was deliberately skipped.
    if: ${{ always() && needs.validate.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by the release SHA only. Nothing mutable such as "latest" is
      # published, so a tag can never silently move to different content.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            GIT_COMMIT_SHA=${{ needs.validate.outputs.release_sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:sha-${{ needs.validate.outputs.release_sha }}

      # deploy-staging.sh compares the OCI revision label and the container
      # identities against its configuration. Report them from the pushed
      # image so the Staging config file can be filled in from evidence.
      - name: Verify pushed image and report deployment evidence
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          reference="${REGISTRY}/${IMAGE_REPOSITORY}@${DIGEST}"
          docker pull --quiet "$reference"

          revision=$(docker image inspect "$reference" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          if [ "$revision" != "$RELEASE_SHA" ]; then
            echo "::error::Image revision label $revision does not match $RELEASE_SHA."
            exit 1
          fi

          growthos_uid=$(docker run --rm --network none --entrypoint id "$reference" -u growthos)
          growthos_gid=$(docker run --rm --network none --entrypoint id "$reference" -g growthos)

          {
            echo "## Release image"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Release SHA | \`$RELEASE_SHA\` |"
            echo "| OCI revision | \`$revision\` |"
            echo "| Repository | \`${REGISTRY}/${IMAGE_REPOSITORY}\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| growthos UID | \`$growthos_uid\` |"
            echo "| growthos GID | \`$growthos_gid\` |"
            echo
            echo "Values for the non-secret Staging environment file:"
            echo
            echo '```dotenv'
            echo "STAGING_IMAGE_REPOSITORY=${REGISTRY}/${IMAGE_REPOSITORY}"
            echo "STAGING_IMAGE_DIGEST=$DIGEST"
            echo "GROWTHOS_UID=$growthos_uid"
            echo "GROWTHOS_GID=$growthos_gid"
            echo '```'
            echo
            echo "This workflow does not deploy. Run \`scripts/deploy-staging.sh\`"
            echo "separately in an approved window."
          } >> "$GITHUB_STEP_SUMMARY"
